name: capstone2
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  get: ^4.6.6
  geolocator: ^13.0.1
  cupertino_icons: ^1.0.8
  mobile_scanner: ^5.1.1
  image_picker: ^1.1.2
  get_storage: ^2.1.1
  http: ^1.6.0
  google_sign_in: ^6.2.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.0      
  gpx: ^2.1.1      
  shared_preferences: ^2.2.1
  url_launcher: ^6.1.14
  webview_flutter: ^4.7.0
  qr_flutter: ^4.1.0
  flutter_map_tile_caching: ^9.1.4 
  intl: ^0.19.0
  ultralytics_yolo: ^0.6.9
  flutter_compass: ^0.8.1 

  nearby_connections: ^4.0.0   
  torch_light: ^1.1.0          
  audioplayers: ^6.0.0         
  permission_handler: ^11.3.1  

  geocoding: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1 # <-- Paket generator logo kustom lo dimasukkan di sini

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/models/best.tflite
    - assets/sounds/sos_alarm.mp3

# KONFIGURASI LOGO APLIKASI (Sejajar baris paling kiri)
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png" # <-- Pastikan file logo lo di folder assets/images namanya logo.png
  adaptive_icon_background: "#121212"  # Background gelap premium biar matching sama tema modern-dark
  adaptive_icon_foreground: "assets/images/logo.png"